# Local / staging stack. Secrets come from .env (copy .env.example). Not a public deployment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suma
      POSTGRES_USER: ${SUMA_DB_USER:-suma}
      POSTGRES_PASSWORD: ${SUMA_DB_PASSWORD:?set SUMA_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUMA_DB_USER:-suma} -d suma"]
      interval: 5s
      retries: 20

  mailpit:
    # Captures all outgoing email locally (web UI on :8025). Nothing is delivered to real recipients.
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUMA_DB_URL: jdbc:postgresql://postgres:5432/suma
      SUMA_DB_USER: ${SUMA_DB_USER:-suma}
      SUMA_DB_PASSWORD: ${SUMA_DB_PASSWORD}
      SUMA_JWT_SECRET: ${SUMA_JWT_SECRET:?set SUMA_JWT_SECRET in .env}
      SUMA_ENCRYPTION_KEY: ${SUMA_ENCRYPTION_KEY:?set SUMA_ENCRYPTION_KEY in .env}
      SUMA_ADMIN_PASSWORD: ${SUMA_ADMIN_PASSWORD:?set SUMA_ADMIN_PASSWORD in .env}
      SUMA_SMTP_HOST: ${SUMA_SMTP_HOST:-mailpit}
      SUMA_SMTP_PORT: ${SUMA_SMTP_PORT:-1025}
      SUMA_MAIL_FROM: ${SUMA_MAIL_FROM:-suma-noreply@localhost}
      SUMA_TRUSTED_PROXIES: ${SUMA_TRUSTED_PROXIES:-172.16.0.0/12}
      SUMA_CORS_ORIGINS: ${SUMA_CORS_ORIGINS:-http://localhost:8081}
      SUMA_COOKIE_SECURE: ${SUMA_COOKIE_SECURE:-false}
      SUMA_DEMO_DATA: ${SUMA_DEMO_DATA:-false}
    volumes:
      - uploads:/app/uploads
    expose:
      - "8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  pgdata:
  uploads:

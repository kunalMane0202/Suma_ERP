server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    # nginx is the edge proxy: overwrite (never append to) any client-supplied X-Forwarded-For so it cannot be spoofed.
    # If another load balancer sits in front, switch to $proxy_add_x_forwarded_for AND list that balancer in SUMA_TRUSTED_PROXIES.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
